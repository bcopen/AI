<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 自动化测试 Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Web 自动化测试 Agent</h1>
            <p>基于 Playwright 的可视化测试配置工具</p>
        </header>

        <main>
            <section class="config-section">
                <h2>测试配置</h2>
                
                <div class="form-group">
                    <label for="testName">测试名称</label>
                    <input type="text" id="testName" placeholder="输入测试名称" value="MyTest">
                </div>

                <div class="form-group">
                    <label>测试步骤</label>
                    <div id="stepsContainer"></div>
                    <button class="btn btn-add" onclick="addStep()">+ 添加步骤</button>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="runTest()">▶️ 运行测试</button>
                    <button class="btn btn-secondary" onclick="clearSteps()">🗑️ 清空步骤</button>
                </div>
            </section>

            <section class="status-section" id="statusSection" style="display: none;">
                <h2>执行状态</h2>
                <div class="progress-bar">
                    <div class="progress" id="progressBar"></div>
                </div>
                <p id="statusText">准备中...</p>
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <h2>测试结果</h2>
                <div class="summary" id="summary"></div>
                <div class="report-link" id="reportLink"></div>
            </section>
        </main>

        <!-- Step Template -->
        <template id="stepTemplate">
            <div class="step-item">
                <div class="step-header">
                    <span class="step-number">#</span>
                    <select class="action-select"></select>
                    <button class="btn-remove" onclick="removeStep(this)">×</button>
                </div>
                <div class="step-params"></div>
            </div>
        </template>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
